<!doctype html>
<html lang="en" data-theme="{{.Theme}}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Atria - Personal Mind Palace</title>
        <link rel="stylesheet" href="/static/water.css?v=2" />
        <link rel="stylesheet" href="/static/style.css?v=13" />
        <link rel="icon" type="image/png" href="/static/atria.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#0d1117" />
        <meta name="htmx-config" content='{"allowEval": false}' />
        <script src="/static/htmx.min.js?v=2"></script>
        <script src="/static/ebook.js?v=2"></script>
        <meta name="csrf-token" content="{{.CSRFToken}}" />
        <meta name="atria-build" content="{{.UIBuild}}" />

    </head>
    <body>
        {{if .User}}
        <div id="mobile-header">
            <h3
                style="
                    margin: 0;
                    font-size: 1.2rem;
                    color: var(--accent);
                    letter-spacing: 2px;
                "
            >
                <span id="dynamic-header-title">ATRIA</span>
            </h3>
            <button id="menu-toggle">
                <span class="icon icon-menu"></span>
            </button>
        </div>

        <div id="sidebar-backdrop"></div>

        <aside id="sidebar">
            <nav style="display: flex; flex-direction: column; width: 100%">
                <a
                    href="/"
                    hx-get="/"
                    hx-target="#main-content"
                    hx-push-url="true"
                    class="nav-link active"
                    title="Home"
                    ><span class="icon icon-home"></span
                ></a>
                <a
                    href="/rss"
                    hx-get="/rss"
                    hx-target="#main-content"
                    hx-push-url="true"
                    class="nav-link"
                    title="RSS"
                    ><span class="icon icon-rss"></span
                ></a>
                <a
                    href="/read"
                    hx-get="/read"
                    hx-target="#main-content"
                    hx-push-url="true"
                    class="nav-link"
                    title="Articles"
                    ><span class="icon icon-bookmark"></span
                ></a>
                <a
                    href="/notes"
                    hx-get="/notes"
                    hx-target="#main-content"
                    hx-push-url="true"
                    class="nav-link"
                    title="Notes"
                    ><span class="icon icon-note"></span
                ></a>
                <a
                    href="/ebooks"
                    hx-get="/ebooks"
                    hx-target="#main-content"
                    hx-push-url="true"
                    class="nav-link"
                    title="E-books"
                    >
                    <svg class="nav-book-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                    </svg>
                </a>
                <a
                    href="/games"
                    hx-get="/games"
                    hx-target="#main-content"
                    hx-push-url="true"
                    class="nav-link"
                    title="Games"
                    aria-label="Games"
                    ><span aria-hidden="true">🎲</span></a
                >
                <a
                    href="/tables"
                    hx-get="/tables"
                    hx-target="#main-content"
                    hx-push-url="true"
                    class="nav-link"
                    title="Tables"
                    ><span class="icon icon-table"></span
                ></a>
                <a
                    href="/search"
                    hx-get="/search"
                    hx-target="#main-content"
                    hx-push-url="true"
                    class="nav-link"
                    title="Search"
                    ><span class="icon icon-search"></span
                ></a>
            </nav>
            <div style="display: flex; flex-direction: column; width: 100%">
                <a
                    href="/settings/rss"
                    hx-get="/settings/rss"
                    hx-target="#main-content"
                    hx-push-url="true"
                    class="nav-link"
                    ><span class="icon icon-settings"></span
                ></a>
                <a
                    href="/profile"
                    hx-get="/profile"
                    hx-target="#main-content"
                    hx-push-url="true"
                    class="nav-link"
                    ><span class="icon icon-user"></span
                ></a>
            </div>
        </aside>
        {{end}}

        <main id="main-content">{{template "content" .}}</main>

        <script src="/static/app.js?v=5"></script>
        <script type="module" src="/static/plugins.js?v=3"></script>
    </body>
</html>
