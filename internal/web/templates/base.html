<!doctype html>
<html lang="en" data-theme="{{.Theme}}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Atria - Personal Mind Palace</title>
        <link rel="stylesheet" href="/static/water.css?v=2" />
        <link rel="stylesheet" href="/static/style.css?v=22" />
        <link rel="icon" type="image/png" href="/static/atria.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#0d1117" />
        <meta name="htmx-config" content='{"allowEval": false}' />
        <script src="/static/htmx.min.js?v=2"></script>
        <script src="/static/ebook.js?v=3"></script>
        <meta name="csrf-token" content="{{.CSRFToken}}" />
        <meta name="atria-build" content="{{.UIBuild}}" />

    </head>
    <body>
        {{if .User}}
        <div id="mobile-header">
            <p class="mobile-title"><span id="dynamic-header-title">ATRIA</span></p>
            <button id="menu-toggle" type="button" title="Menu" aria-label="Menu">
                <span class="icon icon-menu" aria-hidden="true"></span>
            </button>
        </div>

        <div id="sidebar-backdrop"></div>

        <aside id="sidebar">
            <nav class="sidebar-group" aria-label="Main">
                <a href="/" hx-get="/" hx-target="#main-content" hx-push-url="true" class="nav-link" title="Home" aria-label="Home"><span class="icon icon-home" aria-hidden="true"></span></a>
                <a href="/rss" hx-get="/rss" hx-target="#main-content" hx-push-url="true" class="nav-link" title="RSS" aria-label="RSS"><span class="icon icon-rss" aria-hidden="true"></span></a>
                <a href="/read" hx-get="/read" hx-target="#main-content" hx-push-url="true" class="nav-link" title="Read-it-later" aria-label="Read-it-later"><span class="icon icon-bookmark" aria-hidden="true"></span></a>
                <a href="/notes" hx-get="/notes" hx-target="#main-content" hx-push-url="true" class="nav-link" title="Notes" aria-label="Notes"><span class="icon icon-note" aria-hidden="true"></span></a>
                <a href="/ebooks" hx-get="/ebooks" hx-target="#main-content" hx-push-url="true" class="nav-link" title="E-books" aria-label="E-books"><span class="icon icon-book" aria-hidden="true"></span></a>
                <a href="/games" hx-get="/games" hx-target="#main-content" hx-push-url="true" class="nav-link" title="Games" aria-label="Games"><span class="icon icon-dice" aria-hidden="true"></span></a>
                <a href="/tables" hx-get="/tables" hx-target="#main-content" hx-push-url="true" class="nav-link" title="Tables" aria-label="Tables"><span class="icon icon-table" aria-hidden="true"></span></a>
                <a href="/search" hx-get="/search" hx-target="#main-content" hx-push-url="true" class="nav-link" title="Search" aria-label="Search"><span class="icon icon-search" aria-hidden="true"></span></a>
            </nav>
            <nav class="sidebar-group" aria-label="Account">
                <a href="/settings/rss" hx-get="/settings/rss" hx-target="#main-content" hx-push-url="true" class="nav-link" title="Settings" aria-label="Settings"><span class="icon icon-settings" aria-hidden="true"></span></a>
                <a href="/profile" hx-get="/profile" hx-target="#main-content" hx-push-url="true" class="nav-link" title="Profile" aria-label="Profile"><span class="icon icon-user" aria-hidden="true"></span></a>
            </nav>
        </aside>
        {{end}}

        <main id="main-content">{{template "content" .}}</main>

        <script src="/static/app.js?v=7"></script>
        <script type="module" src="/static/plugins.js?v=3"></script>
    </body>
</html>
