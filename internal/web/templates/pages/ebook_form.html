{{define "content"}}
<div class="centered-view" data-mobile-title="ATRIA: Create e-book" style="max-width: 760px">
    <div class="page-header-row mb-3">
        <h2>Create e-book</h2>
        <a href="/ebooks" hx-get="/ebooks" hx-target="#main-content" hx-push-url="true" class="button-link outline btn-sm">← Back</a>
    </div>

    <form method="post" action="/api/ebooks/create" enctype="multipart/form-data">
        <div class="form-group">
            <label for="ebook-title">Title</label>
            <input id="ebook-title" name="title" class="form-control" required />
        </div>
        <div class="form-group">
            <label for="ebook-source-ids">Source article and note IDs</label>
            <textarea id="ebook-source-ids" name="source_ids" class="form-control" rows="8" placeholder="One full UUID or short ID per line" required></textarea>
            <small class="text-muted">Invalid or unsupported IDs are ignored. Input order determines chapter order.</small>
        </div>
        <div class="form-group">
            <label for="ebook-description">Description</label>
            <textarea id="ebook-description" name="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="ebook-author">Author or publisher</label>
            <input id="ebook-author" name="author" class="form-control" />
        </div>
        <div class="form-group">
            <label for="ebook-language">Language</label>
            <input id="ebook-language" name="language" class="form-control" placeholder="cs or en" />
        </div>
        <div class="form-group">
            <label for="ebook-cover">Cover image</label>
            <input id="ebook-cover" type="file" name="cover" accept="image/*" class="form-control" />
        </div>
        <div class="form-group">
            <label for="ebook-filename">EPUB filename</label>
            <input id="ebook-filename" name="filename" class="form-control" placeholder="my-book.epub" />
        </div>
        <div class="flex-row">
            <button type="submit" class="btn-primary">Create EPUB</button>
            <a href="/ebooks" class="button-link outline">Cancel</a>
        </div>
    </form>
</div>
{{end}}
