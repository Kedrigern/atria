{{define "content"}}
<div class="centered-view" data-mobile-title="ATRIA: Create e-book">
    <header class="page-header">
        <h1 class="page-title">Create e-book</h1>
    </header>

    <form method="post" action="/api/ebooks/create" enctype="multipart/form-data">
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}" />
        <div class="form-group">
            <label for="ebook-title">Title</label>
            <input id="ebook-title" name="title" class="form-control" required />
        </div>
        <div class="form-group">
            <label for="ebook-source-ids">Articles and notes</label>
            <textarea id="ebook-source-ids" name="source_ids" class="form-control" rows="8" required></textarea>
            <p class="form-help">One short ID or UUID per line. The order of the lines is the order of the chapters. Atria ignores IDs that it cannot find.</p>
        </div>
        <div class="form-group">
            <label for="ebook-description">Description</label>
            <textarea id="ebook-description" name="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="ebook-author">Author or publisher</label>
            <input id="ebook-author" name="author" class="form-control" />
        </div>
        <div class="form-group">
            <label for="ebook-language">Language</label>
            <input id="ebook-language" name="language" class="form-control" />
            <p class="form-help">A language code, for example cs or en.</p>
        </div>
        <div class="form-group">
            <label for="ebook-cover">Cover image</label>
            <input id="ebook-cover" type="file" name="cover" accept="image/*" class="form-control" />
        </div>
        <div class="form-group">
            <label for="ebook-filename">File name</label>
            <input id="ebook-filename" name="filename" class="form-control" placeholder="my-book.epub" />
        </div>
        <div class="form-actions">
            <a href="/ebooks" hx-get="/ebooks" hx-target="#main-content" hx-push-url="true" class="button-link outline">Cancel</a>
            <button type="submit" class="btn-primary">Create e-book</button>
        </div>
    </form>
</div>
{{end}}
