{{define "content"}}
<link rel="stylesheet" href="/static/tabulator.min.css" />
<div class="centered-view full" data-mobile-title="ATRIA: {{.Table.Title}}">
    {{template "flash_message" .}}
    <div class="page-header-row mb-3 table-header">
        <div>
            <h2 style="margin-bottom: 0">{{.Table.Title}}</h2>
            <small class="text-muted">SQL name <code>{{.Table.SQLName}}</code> · <span data-table-rowcount>{{.Table.RowCount}}</span> rows</small>
        </div>
        <div class="action-row">
            <button type="button" class="outline btn-sm" data-table-add-row>+ Row</button>
            <button type="button" class="outline btn-sm" data-open-dialog="table-columns-dialog">Columns</button>
            <a href="/tables/{{.Table.ID}}/export.csv" class="button-link outline btn-sm">Export CSV</a>
            <form method="post" action="/api/tables/{{.Table.ID}}/delete" class="inline-action-form" data-confirm="Move this table to the trash?">
                <input type="hidden" name="_csrf" value="{{.CSRFToken}}" />
                <button type="submit" class="outline btn-sm btn-danger" title="Delete table"><span class="icon-sm icon-trash"></span></button>
            </form>
        </div>
    </div>

    <p class="table-status text-muted" data-table-status aria-live="polite"></p>
    <div id="table-editor" data-table-id="{{.Table.ID}}"></div>

    <dialog id="table-columns-dialog" class="table-columns-dialog">
        <form method="dialog" data-table-columns-form>
            <h3>Columns</h3>
            <p class="text-muted" style="font-size: 0.85rem">The name is used in SQL views (a-z, 0-9, _). Changing a type converts values; values that do not fit are cleared.</p>
            <div data-table-columns></div>
            <template data-table-column-template>
                <fieldset class="table-column-row">
                    <input type="hidden" name="id" />
                    <label>Name <input type="text" name="name" required pattern="[a-z_][a-z0-9_]*" maxlength="63" /></label>
                    <label>Label <input type="text" name="label" maxlength="200" /></label>
                    <label>Type
                        <select name="type">
                            {{range .ColumnTypes}}<option value="{{.}}">{{.}}</option>{{end}}
                        </select>
                    </label>
                    <label>Decimals <input type="number" name="decimals" min="0" max="10" /></label>
                    <label>Options <small class="text-muted">(select, one per line)</small><textarea name="options" rows="2"></textarea></label>
                    <button type="button" class="outline btn-sm btn-danger" data-table-remove-column>Remove</button>
                </fieldset>
            </template>
            <div class="flex-row flex-between mt-3">
                <button type="button" class="outline btn-sm" data-table-add-column>+ Column</button>
                <div class="action-row">
                    <button type="submit" value="cancel" class="outline">Cancel</button>
                    <button type="button" class="btn-primary" data-table-save-columns>Save</button>
                </div>
            </div>
        </form>
    </dialog>
</div>
<script src="/static/tabulator.min.js"></script>
<script src="/static/tables.js?v=3"></script>
{{end}}
