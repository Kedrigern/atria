{{define "content"}}
<div class="centered-view" style="max-width: 760px">
<h2>Edit e-book metadata</h2>
<form method="post" action="/api/ebooks/{{.Ebook.ID}}/update">
<input type="hidden" name="_csrf" value="{{.CSRFToken}}" />
<div class="form-group">
    <label for="ebook-edit-title">Title</label>
    <input id="ebook-edit-title" name="title" value="{{.Ebook.Title}}" class="form-control" required />
</div>
<div class="form-group">
    <label for="ebook-edit-description">Description</label>
    <textarea id="ebook-edit-description" name="description" class="form-control" rows="3">{{if .Ebook.Description}}{{.Ebook.Description}}{{end}}</textarea>
</div>
<div class="form-group">
    <label for="ebook-edit-author">Author or publisher</label>
    <input id="ebook-edit-author" name="author" value="{{if .Ebook.Author}}{{.Ebook.Author}}{{end}}" class="form-control" />
</div>
<div class="form-group">
    <label for="ebook-edit-language">Language</label>
    <input id="ebook-edit-language" name="language" value="{{if .Ebook.Language}}{{.Ebook.Language}}{{end}}" class="form-control" />
</div>
<button class="btn-primary">Save metadata</button> <a href="/ebooks/{{.Ebook.ID}}" class="button-link outline">Cancel</a>
</form>
</div>
{{end}}
