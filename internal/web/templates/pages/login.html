{{define "content"}}
<div class="login-view">
    <div class="login-card">
        <header class="login-header">
            <h1 class="page-title">Atria</h1>
            <p class="page-subtitle">Log in to your knowledge base.</p>
        </header>

        {{template "flash_message" .}}

        <form action="/login" method="POST">
            <input type="hidden" name="_csrf" value="{{.CSRFToken}}" />
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus autocomplete="username" class="form-control" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" class="form-control" />
            </div>
            <button type="submit" class="btn-primary login-submit">Log in</button>
        </form>

        <p class="form-help login-sso">If you open Atria through the single sign-on proxy (Authelia), you are logged in automatically.</p>
    </div>
</div>
{{end}}
