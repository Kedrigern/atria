{{define "content"}}
<div class="centered-view" data-mobile-title="ATRIA: Import e-book" style="max-width: 760px">
    <div class="page-header-row mb-3">
        <h2>Import EPUB</h2>
        <a href="/ebooks" hx-get="/ebooks" hx-target="#main-content" hx-push-url="true" class="button-link outline btn-sm">← Back</a>
    </div>

    <form method="post" action="/api/ebooks/import" enctype="multipart/form-data">
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}" />
        <div class="form-group">
            <label for="import-ebook-file">EPUB file</label>
            <input id="import-ebook-file" type="file" name="epub" accept="application/epub+zip,.epub" class="form-control" required />
        </div>
        <div class="form-group">
            <label for="import-ebook-title">Title</label>
            <input id="import-ebook-title" name="title" class="form-control" required />
        </div>
        <div class="form-group">
            <label for="import-ebook-description">Description</label>
            <textarea id="import-ebook-description" name="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="import-ebook-author">Author or publisher</label>
            <input id="import-ebook-author" name="author" class="form-control" />
        </div>
        <div class="form-group">
            <label for="import-ebook-language">Language</label>
            <input id="import-ebook-language" name="language" class="form-control" placeholder="cs or en" />
        </div>
        <div class="flex-row">
            <button type="submit" class="btn-primary">Import EPUB</button>
            <a href="/ebooks" class="button-link outline">Cancel</a>
        </div>
    </form>
</div>
{{end}}
