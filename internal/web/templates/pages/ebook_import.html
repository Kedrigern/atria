{{define "content"}}
<div class="centered-view" data-mobile-title="ATRIA: Import e-book">
    <header class="page-header">
        <h1 class="page-title">Import EPUB</h1>
    </header>

    <form method="post" action="/api/ebooks/import" enctype="multipart/form-data">
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}" />
        <div class="form-group">
            <label for="import-ebook-file">EPUB file</label>
            <input id="import-ebook-file" type="file" name="epub" accept="application/epub+zip,.epub" class="form-control" required />
            <p class="form-help">Atria reads the title, description, author, language and cover from the file, if the file has them. You can edit them after the import.</p>
        </div>
        <div class="form-actions">
            <a href="/ebooks" hx-get="/ebooks" hx-target="#main-content" hx-push-url="true" class="button-link outline">Cancel</a>
            <button type="submit" class="btn-primary">Import EPUB</button>
        </div>
    </form>
</div>
{{end}}
