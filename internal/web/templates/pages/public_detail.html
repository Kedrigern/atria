{{define "content"}}
<div class="centered-view public-view">
    <p class="public-brand">ATRIA</p>
    <h1 class="reading-title">{{.Title}}</h1>
    {{if .SourceURL}}
    <p class="reading-meta">Source: <a href="{{.SourceURL}}" target="_blank" rel="noopener noreferrer">Open original</a></p>
    {{end}}
    <article class="reading-body" {{if not .SourceURL}}data-render-math{{end}}>{{.Content}}</article>
</div>
{{end}}
