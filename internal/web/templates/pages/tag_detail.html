{{define "content"}}
<div class="centered-view" data-mobile-title="ATRIA: Tag">
    <header class="page-header">
        <h1 class="page-title">#{{.TagName}}</h1>
        <div class="page-actions">
            <a href="/settings/tags" class="button-link outline btn-sm">
                <span class="icon-sm icon-chevron-left" aria-hidden="true"></span> Tags
            </a>
        </div>
    </header>

    {{range .Entities}}
    <div class="list-item entity-list-item">
        <span class="badge">{{.Type}}</span>
        <h2 class="list-item-title">
            {{if eq .Type "note"}}
            <a href="/notes/{{.ID}}">{{.Title}}</a>
            {{else if eq .Type "article"}}
            <a href="/read/{{.ID}}">{{.Title}}</a>
            {{else}}{{.Title}}{{end}}
        </h2>
    </div>
    {{else}}
    <p class="page-empty-hint">No items have this tag.</p>
    {{end}}
</div>
{{end}}
