{{define "content"}}
<div class="centered-view" data-mobile-title="ATRIA: Notes">
    <header class="page-header">
        <h1 class="page-title">New note</h1>
    </header>

    <form hx-post="/api/notes/create" hx-target="#main-content">
        <div class="form-group">
            <label for="note-title">Title</label>
            <input id="note-title" type="text" name="title" class="form-control" required />
        </div>

        <div class="form-group">
            <label for="note-path">Folder</label>
            <input id="note-path" type="text" name="path" value="/" class="form-control" />
            <p class="form-help">For example /projects/atria. Use / for the top level.</p>
        </div>

        <div class="form-group">
            <label for="note-content">Content (Markdown)</label>
            <textarea id="note-content" name="content" class="form-control markdown-editor"></textarea>
        </div>

        <div class="form-actions">
            <a href="/notes" hx-get="/notes" hx-target="#main-content" hx-push-url="true" class="button-link outline">Cancel</a>
            <button type="submit" class="btn-primary">Create note</button>
        </div>
    </form>
</div>
{{end}}
